name: Run Tests

on:
  pull_request:
    branches:
      - main
      - "**develop**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript for errors
        run: pnpm run typecheck

      - name: Run Linter
        run: pnpm run lint

      - name: Run Test
        run: xvfb-run pnpm test
